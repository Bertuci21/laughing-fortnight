<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://www.cps.sp.gov.br/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSM | Login</title>
    <link rel="stylesheet" href="/public/assets/css/main.css" />
  </head>
  <body>
    <main class="card">
      <h1 class="title">Login</h1>

      <form class="auth-form" action="#" method="post">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required />

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required />
      </form>

      <div class="actions">
        <button class="btn-link" type="submit">Entrar</button>
        <a class="btn-link" href="cadastro.html">Ir para cadastro</a>
        <a class="btn-link btn-secondary" href="index.html">Voltar</a>
      </div>
    </main>

    <script src="/server.js"></script>
  </body>
</html>
